# Production deploy: every push to main is uploaded by FTP to the Aruba hosting
# of techs-gardenhouse.com. Needs the repository secrets FTP_SERVER, FTP_USERNAME
# and FTP_PASSWORD. The action keeps .ftp-deploy-sync-state.json on the server,
# so only changed files are uploaded after the first run.
name: Deploy to Aruba (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Aruba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: www.techs-gardenhouse.com/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            docs/**
            README.md
            **/.DS_Store
            **/__pycache__/**
